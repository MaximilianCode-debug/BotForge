 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – BotForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 450px; margin: 0 auto; }
        .card { border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="card border-0">
                <div class="card-header bg-primary text-white text-center py-4">
                    <i class="fas fa-robot fa-3x mb-2"></i>
                    <h3 class="mb-0">Welcome Back</h3>
                    <p class="mb-0 small">Login to your BotForge dashboard</p>
                </div>
                <div class="card-body p-4">
                    {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endif %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="fab fa-telegram text-info me-1"></i> Bot Token</label>
                            <input type="text" name="token" class="form-control form-control-lg" placeholder="Enter your bot token" required>
                            <div class="form-text">From @BotFather on Telegram</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="fas fa-lock text-danger me-1"></i> Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="Your password" required>
                            <div class="form-text">The password you set during registration</div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-arrow-right me-2"></i>Login
                        </button>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <p class="mb-2">Don't have a bot yet?</p>
                        <a href="/" class="btn btn-outline-success w-100">
                            <i class="fas fa-rocket me-2"></i>Register Now
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
